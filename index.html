<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef0f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>角色幀動畫與貼圖工作室</title>
    <style>
      .safe-top { padding-top: env(safe-area-inset-top, 0); }
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0); }
      .safe-left { padding-left: env(safe-area-inset-left, 0); }
      .safe-right { padding-right: env(safe-area-inset-right, 0); }
      .touch-manipulation { touch-action: manipulation; }
      .tap-highlight { -webkit-tap-highlight-color: rgba(226, 61, 47, 0.14); }
      input[type=range] {
        -webkit-appearance: none;
        appearance: none;
        touch-action: manipulation;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        height: 22px;
        width: 22px;
        border-radius: 50%;
        background: #E23D2F;
        cursor: pointer;
        margin-top: -8px;
        box-shadow: 0 2px 6px rgba(20, 23, 31, 0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      @media (min-width: 768px) {
        input[type=range]::-webkit-slider-thumb { height: 18px; width: 18px; margin-top: -7px; }
      }
      input[type=range]::-webkit-slider-thumb:hover {
        transform: scale(1.08);
        box-shadow: 0 3px 8px rgba(20, 23, 31, 0.28);
      }
      input[type=range]::-webkit-slider-thumb:active {
        transform: scale(0.96);
      }
      input[type=range]::-moz-range-thumb {
        height: 22px;
        width: 22px;
        border-radius: 50%;
        background: #E23D2F;
        cursor: pointer;
        border: none;
        box-shadow: 0 2px 6px rgba(20, 23, 31, 0.2);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      @media (min-width: 768px) {
        input[type=range]::-moz-range-thumb { height: 18px; width: 18px; }
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 8px;
        cursor: pointer;
        background: #D5D9E2;
        border-radius: 4px;
      }
      input[type=range]::-moz-range-track {
        width: 100%;
        height: 8px;
        cursor: pointer;
        background: #D5D9E2;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar { width: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #E4E7EE;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #B8BECB;
        border-radius: 4px;
        transition: background 0.2s ease;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #8B92A3; }
      .pixelated {
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
      }
    </style>
</head>
  <body class="antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
