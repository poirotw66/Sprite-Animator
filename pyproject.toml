[project]
name = "sprite-animator-python-tools"
version = "0.1.0"
description = "Python tooling for LINE sticker conversion and upload automation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-api-python-client>=2.100.0",
  "google-auth-httplib2>=0.2.0",
  "google-auth-oauthlib>=1.2.0",
  "numpy>=1.24.0",
  "pillow>=10.0.0",
  "playwright>=1.40.0",
]

[dependency-groups]
dev = [
  "fonttools[woff]>=4.62.1,<5",
  "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
testpaths = [
  "scripts/line-sticker/python/sheet_converter_v2/tests",
  "skills/line-sticker-upload/scripts",
]
python_files = ["test_*.py"]

[tool.uv]
package = false
required-version = ">=0.11.28,<0.12"
