name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Install locked Python environment
        run: uv sync --locked --dev

      - name: Security audit
        run: npm run security:audit

      - name: Scan repository for API credentials
        run: npm run security:secrets

      # Mirrors are gitignored generated copies of skills/; sync before tests that expect them.
      - name: Sync LINE sticker skill mirrors
        run: npm run skills:sync:line-sticker

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check generated preview assets
        run: npm run previews:check

      - name: Test TypeScript
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test browser routes
        run: npm run test:e2e

      - name: Test Python
        run: npm run python:check

      - name: Build
        env:
          GITHUB_PAGES: 'true'
          # Deliberately shaped like a Gemini key, but split in source so the
          # repository secret scan does not mistake this synthetic value for a
          # credential. The post-build scan must fail if browser key isolation
          # ever regresses and this sentinel reaches dist/.
          GEMINI_API_KEY: ${{ format('{0}{1}', 'AI', 'za01234567890123456789012345678901234') }}
        run: npm run build

      - name: Scan production bundle for API credentials
        run: npm run security:bundle

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality-gate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
